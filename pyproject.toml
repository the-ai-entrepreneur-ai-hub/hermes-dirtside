[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "dirtside"
version = "0.1.0"
description = "Run Hermes terminal commands on a chosen personal device."
requires-python = ">=3.11"
dependencies = ["pynacl>=1.5,<2", "httpx>=0.28.1,<0.29"]

[project.scripts]
dirtside-agent = "dirtside.agent.console:main"

[project.entry-points."hermes_agent.plugins"]
dirtside = "dirtside:register"

[tool.setuptools.packages.find]
include = ["dirtside*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: real loss-window subprocess conformance, included by default"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
