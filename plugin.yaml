name: dirtside
label: Dirtside
kind: backend
version: 0.1.0
author: George Kioko
description: >
  Terminal commands use a chosen device; file paths resolve on the gateway.
  Disclosure: adds a terminal backend and can execute shell scripts with the
  device user's privileges. Approvals stay enabled. Adds signed HTTP device
  routes and dashboard-session controls to the gateway. The foreground device
  agent polls the paired gateway over outbound HTTP. Pairing pins its public key.
  Device policy enforces deny patterns, timeout, output and parallelism caps,
  not a filesystem sandbox. No telemetry.
requires_hermes: ">=0.22.7"
provides_tools: []
provides_hooks: [pre_llm_call]
provides_middleware: [tool_execution]
requires_env: []
config_schema:
  owners:
    type: list
    default: []
    description: Global device owners (local or platform:user). Local host users always retain access.
  default_target:
    type: str
    default: server
    description: Default target before a conversation chooses a device (server or a paired name).
python_dependencies:
  - "pynacl>=1.5,<2"
  - "httpx>=0.28.1,<0.29"
