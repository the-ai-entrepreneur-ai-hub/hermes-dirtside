<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Dirtside architecture: chat surfaces, the Hermes gateway with the Dirtside plugin, and a device agent that only dials out">
<defs>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8E"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker>
</defs>
<rect x="40" y="70" width="210" height="440" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M40 82 a12 12 0 0 1 12 -12 h186 a12 12 0 0 1 12 12 v32 h-210 z" fill="#EAEEF2"/>
<text x="145.0" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328">Where you talk</text>
<rect x="56" y="134" width="178" height="38" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="145.0" y="158.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Telegram</text>
<rect x="56" y="186" width="178" height="38" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="145.0" y="210.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Discord</text>
<rect x="56" y="238" width="178" height="38" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="145.0" y="262.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Web dashboard</text>
<rect x="56" y="290" width="178" height="38" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="145.0" y="314.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Desktop app</text>
<rect x="56" y="342" width="178" height="38" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="145.0" y="366.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Terminal (CLI)</text>
<rect x="56" y="420" width="178" height="60" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="145.0" y="447" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#1F2328">/dirtside use macbook</text>
<text x="145.0" y="467" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">one chat, one target</text>
<line x1="252" y1="290" x2="358" y2="290" stroke="#57606A" stroke-width="2.5" marker-end="url(#arrow-text)"/>
<text x="305.0" y="264" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">chat</text>
<text x="305.0" y="281" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">approvals included</text>
<rect x="360" y="70" width="400" height="440" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M360 82 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v32 h-400 z" fill="#1B2430"/>
<text x="560.0" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Your server: the Hermes gateway</text>
<rect x="378" y="128" width="364" height="112" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="560" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Hermes Agent core</text>
<text x="560" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">model, conversation state, approvals</text>
<text x="560" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">terminal and file tools ask the environment provider</text>
<text x="560" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1F2328">terminal.backend: dirtside</text>
<rect x="378" y="256" width="364" height="236" rx="9" fill="none" stroke="#C9683A" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="560" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C9683A">Dirtside plugin</text>
<rect x="390" y="298" width="108" height="74" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="444.0" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Provider</text>
<text x="444.0" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">resolves the</text>
<text x="444.0" y="361" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">chat's target</text>
<rect x="506" y="298" width="108" height="74" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="560.0" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Relay</text>
<text x="560.0" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">live requests,</text>
<text x="560.0" y="361" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">one lock</text>
<rect x="622" y="298" width="108" height="74" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="676.0" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Registry</text>
<text x="676.0" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">SQLite: devices,</text>
<text x="676.0" y="361" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">choices, log</text>
<text x="560" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">signed device routes under</text>
<text x="560" y="418" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1F2328">/api/plugins/dirtside/device/</text>
<text x="560" y="434" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1F2328">pair, poll, chunk, result</text>
<text x="560" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">target "server": core's own local environment,</text>
<text x="560" y="478" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">nothing leaves this box</text>
<rect x="960" y="70" width="280" height="440" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M960 82 a12 12 0 0 1 12 -12 h256 a12 12 0 0 1 12 12 v32 h-280 z" fill="#C9683A"/>
<text x="1100.0" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Your device: macbook</text>
<rect x="980" y="128" width="240" height="38" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="1100.0" y="152.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#1F2328">hermes dirtside serve</text>
<rect x="980" y="180" width="240" height="70" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="1100.0" y="207" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Device agent</text>
<text x="1100.0" y="227" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">long-polls the gateway,</text>
<text x="1100.0" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">verifies every signature</text>
<rect x="980" y="262" width="240" height="70" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="1100.0" y="289" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Policy</text>
<text x="1100.0" y="309" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">deny list, 900 s, 64 MiB,</text>
<text x="1100.0" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">4 parallel commands</text>
<rect x="980" y="344" width="240" height="70" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="1100.0" y="371" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Process group</text>
<text x="1100.0" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">bash as your user,</text>
<text x="1100.0" y="407" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">SIGTERM then SIGKILL</text>
<rect x="980" y="426" width="240" height="64" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="1100.0" y="453" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">Your files and tools</text>
<text x="1100.0" y="473" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">no sandbox: it is your machine</text>
<line x1="958" y1="190" x2="762" y2="190" stroke="#0E9F8E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="860.0" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">1  long poll</text>
<text x="860.0" y="181" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">signed, outbound, parked up to 25 s</text>
<line x1="762" y1="300" x2="958" y2="300" stroke="#0E9F8E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="860.0" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">2  the script rides back</text>
<text x="860.0" y="291" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">inside the poll response, signed</text>
<line x1="958" y1="410" x2="762" y2="410" stroke="#0E9F8E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="860.0" y="384" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">3  output chunks, result</text>
<text x="860.0" y="401" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">signed, 64 KiB or 200 ms per chunk</text>
<line x1="762" y1="490" x2="958" y2="490" stroke="#CF222E" stroke-width="2.5" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/>
<line x1="851.0" y1="481" x2="869.0" y2="499" stroke="#CF222E" stroke-width="3" stroke-linecap="round"/>
<line x1="851.0" y1="499" x2="869.0" y2="481" stroke="#CF222E" stroke-width="3" stroke-linecap="round"/>
<text x="860.0" y="464" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">no inbound connection</text>
<text x="860.0" y="481" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">no open port, no VPN, no relay service</text>
<text x="640" y="556" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328">The device never listens. The gateway never reaches in.</text>
<text x="640" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">Every message is Ed25519-signed, timestamped within 300 s and replay-guarded on both ends.</text>
<text x="640" y="602" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">The gateway owns the timeout; the device deadline is a backstop. A command that never ran is never reported as run.</text>
</svg>
