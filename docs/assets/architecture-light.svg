<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Dirtside architecture: the Hermes gateway with the Dirtside plugin, and a device agent that only dials out">
<defs>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E9F8E"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker>
</defs>
<rect x="40" y="20" width="460" height="44" rx="22" fill="#EAEEF2" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="270" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2328">You, from Telegram, Discord, the dashboard, the Desktop app or the CLI</text>
<line x1="270" y1="66" x2="270" y2="98" stroke="#57606A" stroke-width="2.5" marker-end="url(#arrow-text)"/>
<text x="286" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">chat, approvals included</text>
<rect x="40" y="104" width="460" height="470" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M40 116 a12 12 0 0 1 12 -12 h436 a12 12 0 0 1 12 12 v32 h-460 z" fill="#1B2430"/>
<text x="270.0" y="133" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Your server: the Hermes gateway</text>
<rect x="60" y="164" width="420" height="118" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="270" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328">Hermes Agent core</text>
<text x="270" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">model, conversation state, approvals</text>
<text x="270" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">terminal and file tools ask the environment provider</text>
<text x="270" y="263" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#1F2328">terminal.backend: dirtside</text>
<rect x="60" y="298" width="420" height="258" rx="9" fill="none" stroke="#C9683A" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="270" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9683A">Dirtside plugin</text>
<rect x="72" y="342" width="128" height="84" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="136.0" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Provider</text>
<text x="136.0" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">resolves the</text>
<text x="136.0" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">chat's target</text>
<rect x="206" y="342" width="128" height="84" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="270.0" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Relay</text>
<text x="270.0" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">live requests,</text>
<text x="270.0" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">one lock</text>
<rect x="340" y="342" width="128" height="84" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="404.0" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Registry</text>
<text x="404.0" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">SQLite: devices,</text>
<text x="404.0" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">choices, log</text>
<text x="270" y="456" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">signed device routes under</text>
<text x="270" y="476" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1F2328">/api/plugins/dirtside/device/</text>
<text x="270" y="494" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1F2328">pair, poll, chunk, result</text>
<text x="270" y="522" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">target "server": core's own local environment,</text>
<text x="270" y="541" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">nothing leaves this box</text>
<rect x="700" y="104" width="260" height="470" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M700 116 a12 12 0 0 1 12 -12 h236 a12 12 0 0 1 12 12 v32 h-260 z" fill="#C9683A"/>
<text x="830.0" y="133" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Your device: macbook</text>
<rect x="720" y="164" width="220" height="40" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="830.0" y="189.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" font-weight="700" fill="#1F2328">hermes dirtside serve</text>
<rect x="720" y="218" width="220" height="78" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="830.0" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Device agent</text>
<text x="830.0" y="267" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">long-polls the gateway,</text>
<text x="830.0" y="284" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">verifies every signature</text>
<rect x="720" y="308" width="220" height="78" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="830.0" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Policy</text>
<text x="830.0" y="357" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">deny list, 900 s, 64 MiB,</text>
<text x="830.0" y="374" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">4 parallel commands</text>
<rect x="720" y="398" width="220" height="78" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="830.0" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Process group</text>
<text x="830.0" y="447" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">bash as your user,</text>
<text x="830.0" y="464" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">SIGTERM then SIGKILL</text>
<rect x="720" y="488" width="220" height="68" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
<text x="830.0" y="516" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Your files and tools</text>
<text x="830.0" y="537" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">no sandbox: it is your machine</text>
<line x1="698" y1="196" x2="502" y2="196" stroke="#0E9F8E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="600.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">1  long poll</text>
<text x="600.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">signed, outbound, parked 25 s</text>
<line x1="502" y1="306" x2="698" y2="306" stroke="#0E9F8E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="600.0" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">2  the script rides back</text>
<text x="600.0" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">inside the poll response, signed</text>
<line x1="698" y1="416" x2="502" y2="416" stroke="#0E9F8E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="600.0" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">3  output chunks, result</text>
<text x="600.0" y="407" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">signed, 64 KiB or 200 ms chunks</text>
<line x1="502" y1="520" x2="698" y2="520" stroke="#CF222E" stroke-width="2.5" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/>
<line x1="591.0" y1="511" x2="609.0" y2="529" stroke="#CF222E" stroke-width="3" stroke-linecap="round"/>
<line x1="591.0" y1="529" x2="609.0" y2="511" stroke="#CF222E" stroke-width="3" stroke-linecap="round"/>
<text x="600.0" y="494" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2328">no inbound connection</text>
<text x="600.0" y="511" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">no open port, no VPN, no relay</text>
<text x="500" y="616" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">The device never listens. The gateway never reaches in.</text>
<text x="500" y="644" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">Every message is Ed25519-signed, timestamped within 300 s and replay-guarded on both ends.</text>
<text x="500" y="666" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">The gateway owns the timeout; the device deadline is a backstop. A command that never ran is never reported as run.</text>
</svg>
