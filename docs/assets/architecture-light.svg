<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Dirtside architecture: the Hermes gateway with the Dirtside plugin, and a device agent that only dials out">
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F883D"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker>
</defs>
<rect x="24" y="20" width="512" height="64" rx="24" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="280" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">You, from Telegram, Discord, the dashboard,</text>
<text x="280" y="67" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">the Desktop app or the CLI</text>
<line x1="280" y1="92" x2="280" y2="140" stroke="#1F883D" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="416" y="121" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">chat, approvals included</text>
<rect x="24" y="148" width="512" height="550" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M24 160 a12 12 0 0 1 12 -12 h488 a12 12 0 0 1 12 12 v32 h-512 z" fill="#0B0F14"/>
<text x="280.0" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Your server: the Hermes gateway</text>
<rect x="40" y="208" width="480" height="144" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="280" y="237" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Hermes Agent core</text>
<text x="280" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">model, conversation state, approvals</text>
<text x="280" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">terminal commands ask</text>
<text x="280" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">the environment provider</text>
<text x="280" y="331" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1F2328">terminal.backend: dirtside</text>
<rect x="40" y="368" width="480" height="314" rx="10" fill="none" stroke="#1F883D" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="280" y="397" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F883D">Dirtside plugin</text>
<rect x="52" y="412" width="144" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="124.0" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Provider</text>
<text x="124.0" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">resolves the</text>
<text x="124.0" y="484" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">chat's target</text>
<rect x="208" y="412" width="144" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="280.0" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Relay</text>
<text x="280.0" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">live</text>
<text x="280.0" y="484" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">requests,</text>
<text x="280.0" y="503" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">one lock</text>
<rect x="364" y="412" width="144" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="436.0" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Registry</text>
<text x="436.0" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">SQLite:</text>
<text x="436.0" y="484" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">devices,</text>
<text x="436.0" y="503" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">choices, log</text>
<text x="280" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">signed device routes under</text>
<text x="280" y="576" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328">/api/plugins/dirtside/device/</text>
<text x="280" y="599" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328">pair, poll, chunk, result</text>
<text x="280" y="642" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">target "server": core's own local environment,</text>
<text x="280" y="664" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">nothing leaves this box</text>
<rect x="872" y="148" width="304" height="550" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<path d="M872 160 a12 12 0 0 1 12 -12 h280 a12 12 0 0 1 12 12 v32 h-304 z" fill="#0B0F14"/>
<text x="1024.0" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Your device: macbook</text>
<rect x="888" y="208" width="272" height="44" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="1024" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2328">hermes dirtside serve</text>
<rect x="888" y="268" width="272" height="88" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="1024.0" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Device agent</text>
<text x="1024.0" y="321" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">long-polls the gateway,</text>
<text x="1024.0" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">verifies every signature</text>
<rect x="888" y="372" width="272" height="88" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="1024.0" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Policy</text>
<text x="1024.0" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">deny list, 900 s, 64 MiB,</text>
<text x="1024.0" y="444" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">4 parallel commands</text>
<rect x="888" y="476" width="272" height="88" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="1024.0" y="504" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Process group</text>
<text x="1024.0" y="529" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">bash as your user,</text>
<text x="1024.0" y="548" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">SIGTERM then SIGKILL</text>
<rect x="888" y="580" width="272" height="102" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="1024.0" y="608" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Your files and tools</text>
<text x="1024.0" y="633" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">no sandbox:</text>
<text x="1024.0" y="652" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">it is your machine</text>
<text x="704" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">1  long poll</text>
<text x="704" y="241" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">signed, outbound, parked 25 s</text>
<line x1="864" y1="274" x2="544" y2="274" stroke="#1F883D" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="704" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">2  the script rides back</text>
<text x="704" y="367" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">inside the poll response, signed</text>
<line x1="544" y1="400" x2="864" y2="400" stroke="#1F883D" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="704" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">3  output chunks, result</text>
<text x="704" y="493" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">signed, 2 MiB or 200 ms parts</text>
<line x1="864" y1="526" x2="544" y2="526" stroke="#1F883D" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="704" y="594" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328">no inbound connection</text>
<text x="704" y="619" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57606A">no open port, no VPN, no relay</text>
<line x1="544" y1="652" x2="864" y2="652" stroke="#57606A" stroke-width="2.5" marker-end="url(#arrow-muted)" stroke-dasharray="8 7"/>
<path d="M696 644 L712 660 M696 660 L712 644" fill="none" stroke="#1F2328" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="740" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328">The device never listens. The gateway never reaches in.</text>
<text x="600" y="770" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">Every message is Ed25519-signed, timestamped within 300 s and replay-guarded on both ends.</text>
<text x="600" y="795" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">The gateway owns the timeout; the device deadline is a backstop. A command that never ran is never reported as run.</text>
</svg>
