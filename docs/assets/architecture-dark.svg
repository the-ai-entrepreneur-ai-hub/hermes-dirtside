<rect x="40" y="70" width="210" height="440" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
<path d="M40 82 a12 12 0 0 1 12 -12 h186 a12 12 0 0 1 12 12 v32 h-210 z" fill="#21262D"/>
